name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx2048m -Djava.awt.headless=true' -Djava.awt.headless=true"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        else
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --no-daemon -Djava.awt.headless=true -Pksp.incremental=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeetingAITranscriber-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
